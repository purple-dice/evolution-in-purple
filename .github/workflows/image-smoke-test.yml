name: Image smoke test

on:
  pull_request:
  push:
    branches: [nogara/stable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evolution
          POSTGRES_PASSWORD: evolution
          POSTGRES_DB: evolution
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evolution"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: evolution-api:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Node.js in the image matches the Dockerfile pin
        run: |
          expected="v$(grep -m1 -oE '^FROM node:[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | sed 's/^FROM node://')"
          actual="$(docker run --rm --entrypoint node evolution-api:smoke -v)"
          echo "expected=$expected actual=$actual"
          test "$expected" = "$actual"

      - name: Start the container
        run: |
          docker run -d --name evolution --network host \
            -e SERVER_PORT=8080 \
            -e DATABASE_PROVIDER=postgresql \
            -e DATABASE_CONNECTION_URI='postgresql://evolution:evolution@localhost:5432/evolution?schema=evolution_api' \
            -e CACHE_REDIS_ENABLED=false \
            -e CACHE_LOCAL_ENABLED=true \
            -e AUTHENTICATION_API_KEY=smoke-test-key \
            -e TELEMETRY_ENABLED=false \
            evolution-api:smoke

      - name: Wait for HTTP 200 on /
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ -o body.json; then
              cat body.json
              grep -q '"status":200' body.json
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' evolution)" != "true" ]; then
              echo "container exited"
              exit 1
            fi
            sleep 5
          done
          echo "timed out waiting for the API"
          exit 1

      - name: Authenticated route answers
        run: |
          curl -fsS -H 'apikey: smoke-test-key' http://localhost:8080/instance/fetchInstances

      - name: Container logs
        if: always()
        run: docker logs evolution 2>&1 | tail -200
